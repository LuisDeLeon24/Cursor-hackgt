<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>El Telescopio Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --page: #FFFFFF;
      --text: #161616;
      --text-2: #484848;
      --text-3: #6A6A6A;
      --line: #E4E4E4;
      --font: "Public Sans", system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--page);
      color: var(--text);
      font-family: var(--font);
    }

    main {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      padding: 64px 24px;
    }

    .col {
      width: min(28rem, 100%);
      margin: 0 auto;
    }

    p.label {
      font-size: 0.9375rem;
      color: var(--text-3);
    }

    h1 {
      margin-top: 8px;
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.1;
      text-wrap: balance;
    }

    .desc {
      margin-top: 16px;
      max-width: 34em;
      font-size: 1.0625rem;
      line-height: 1.5;
      color: var(--text-2);
    }

    .qr-wrap {
      margin-top: 32px;
      width: min(240px, 70vw);
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--page);
    }

    .qr-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }

    .url {
      margin-top: 16px;
      font-size: 0.9375rem;
      color: var(--text-2);
    }
  </style>
</head>
<body>
  <main>
    <div class="col">
      <p class="label">TelescopioAR</p>
      <h1>El Telescopio Digital</h1>
      <p class="desc">
        Apunta al cielo, sigue la ISS en tiempo real y descifra la transmisión.
      </p>
      <figure class="qr-wrap">
        <img
          src="assets/qr-sextantar.jpeg"
          alt="Código QR hacia El Telescopio Digital"
          width="240"
          height="240"
        />
      </figure>
      <p class="url">sextantar.vercel.app</p>
    </div>
  </main>
</body>
</html>
