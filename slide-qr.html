<!DOCTYPE html>
<html lang="es" hidden>
<head>
  <script src="js/config.js"></script>
  <script>
    if (window.SEXTANT && window.SEXTANT.visor === true) {
      document.documentElement.hidden = false;
    } else {
      location.replace('/');
    }
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>El Telescopio Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --page: #F6F0E4;
      --text: #1C1008;
      --text-2: #5C4636;
      --text-3: #6A5344;
      --line: #E4D5BC;
      --brass: #7A5B24;
      --font: "Public Sans", system-ui, sans-serif;
      --display: "Source Serif 4", Georgia, serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--page);
      color: var(--text);
      font-family: var(--font);
    }

    main {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      padding: 64px 24px;
    }

    .col {
      width: min(28rem, 100%);
      margin: 0 auto;
    }

    p.label {
      font-size: 0.9375rem;
      color: var(--text-3);
    }

    .mark {
      width: 28px;
      height: 28px;
      margin-bottom: 16px;
      color: var(--brass);
      display: block;
    }

    h1 {
      margin-top: 8px;
      font-family: var(--display);
      font-size: clamp(2rem, 6vw, 2.75rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.05;
      text-wrap: balance;
    }

    .desc {
      margin-top: 16px;
      max-width: 34em;
      font-size: 1.0625rem;
      line-height: 1.5;
      color: var(--text-2);
    }

    .qr-wrap {
      margin-top: 32px;
      width: min(240px, 70vw);
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--page);
    }

    .qr-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }

    .url {
      margin-top: 16px;
      font-size: 0.9375rem;
      color: var(--text-2);
    }
  </style>
</head>
<body>
  <main>
    <div class="col">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <circle cx="16" cy="16" r="11.5" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path d="M16 4.5v5M16 22.5v5M4.5 16h5M22.5 16h5" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <path d="M16 8.2 17.15 14.8h-2.3z" fill="currentColor"/>
      </svg>
      <p class="label">TelescopioAR</p>
      <h1>El Telescopio Digital</h1>
      <p class="desc">
        Apunta al cielo, sigue la ISS en tiempo real y descifra la transmisión.
      </p>
      <figure class="qr-wrap">
        <img
          src="assets/qr-sextantar.jpeg"
          alt="Código QR hacia El Telescopio Digital"
          width="240"
          height="240"
        />
      </figure>
      <p class="url">sextantar.vercel.app</p>
    </div>
  </main>
</body>
</html>
